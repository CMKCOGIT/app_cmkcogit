<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Concluir cadastro | CMKCOGIT</title>
  <meta name="theme-color" content="#0F1B33">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/assets/fonts/cogit-font-5.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cogit-font-6.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css?v=b56da26efd">
  <link rel="stylesheet" href="/css/plataforma.css?v=ac78687a4c">
  <style>@view-transition { navigation: none; }</style>
</head>
<body class="acesso">
  <main>
    <h1>Concluir cadastro</h1>
    <p id="mensagem" role="status">Carregando seu cadastro...</p>

    <form id="form-completar" hidden novalidate>
      <p class="auth-subtitulo">Falta pouco. Confira seus dados para liberar o acesso à plataforma.</p>
      <section id="pendencias" aria-live="polite"></section>
      <p>
        <label for="comp-email">E-mail da conta</label><br>
        <input type="email" id="comp-email" readonly>
      </p>
      <p>
        <label for="comp-nome">Nome</label><br>
        <input type="text" id="comp-nome" autocomplete="name" required maxlength="120">
      </p>
      <p>
        <label for="comp-documento">CPF ou CNPJ da empresa</label><br>
        <input type="text" id="comp-documento" inputmode="numeric" autocomplete="off" maxlength="18" required placeholder="000.000.000-00" aria-describedby="ajuda-documento">
        <small id="ajuda-documento">Usado no contrato, na nota fiscal e no pagamento. Só você e a equipe veem.</small>
      </p>
      <p>
        <label for="comp-telefone">WhatsApp (com DDD, opcional)</label><br>
        <input type="tel" id="comp-telefone" autocomplete="tel" maxlength="16" placeholder="(00) 00000-0000">
      </p>
      <p>
        <input type="checkbox" id="comp-aceite" required>
        <label for="comp-aceite">Li e aceito os <a id="link-termos" href="#" target="_blank" rel="noopener">Termos de Uso</a> e a <a id="link-privacidade" href="#" target="_blank" rel="noopener">Política de Privacidade</a>.</label>
      </p>
      <p id="rascunho" role="status"></p>
      <button type="submit">Concluir cadastro</button>
    </form>
    <p class="completar-sair"><button type="button" id="sair-cadastro">Sair da conta</button></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="js/app.js?v=41529c9ba5"></script>
  <script src="js/completar-cadastro.js?v=3c5f5dcfa2"></script>
</body>
</html>
