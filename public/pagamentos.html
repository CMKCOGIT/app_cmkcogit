<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Pagamentos | CMK COGIT</title>
  <meta name="theme-color" content="#0F1B33">
  <link rel="icon" type="image/png" sizes="64x64" href="/assets/images/favicon-64.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/plataforma.css">
</head>
<body class="app">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <nav id="menu" aria-label="Menu principal"></nav>
  <main id="conteudo">
    <h1>Pagamentos</h1>
    <p id="aviso" role="status"></p>
    <p id="erro" role="alert"></p>

    <section id="resumo-pagamentos"></section>

    <section>
      <h2>Cobranças</h2>
      <table>
        <thead>
          <tr>
            <th scope="col">Descrição</th>
            <th scope="col">Valor</th>
            <th scope="col">Status</th>
            <th scope="col">Método</th>
            <th scope="col">Data</th>
            <th scope="col">Ação</th>
          </tr>
        </thead>
        <tbody id="tabela-pagamentos">
          <tr><td colspan="6">Carregando...</td></tr>
        </tbody>
      </table>
      <p><small>Pix, cartão ou boleto pelo Mercado Pago. O pagamento é confirmado direto com o Mercado Pago; boleto pode levar até 3 dias úteis.</small></p>
    </section>

    <section>
      <h2>Precisa de ajuda?</h2>
      <a id="falar-conosco" href="#" target="_blank" rel="noopener noreferrer">Falar conosco pelo WhatsApp</a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pagamentos.js"></script>
</body>
</html>
