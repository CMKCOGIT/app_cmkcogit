<body class="app">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <nav id="menu" aria-label="Menu principal"></nav>
  <header id="barra-topo"></header>
  <main id="conteudo">
    <header class="pagina-cabecalho">
      <div>
        <p class="pagina-rotulo">Painel de gestão</p>
        <h1>Projetos</h1>
        <p>Tudo o que está em desenvolvimento: etapa, progresso, prazo e pagamento de cada projeto.</p>
      </div>
    </header>
    <p id="aviso" role="status"></p>
    <p id="erro" role="alert"></p>

    <section class="faixa-kpis" aria-label="Resumo dos projetos">
      <ul id="resumo-projetos" class="kpis" data-livre>
        <li class="kpi" data-esqueleto data-destaque></li><li class="kpi" data-esqueleto></li><li class="kpi" data-esqueleto></li><li class="kpi" data-esqueleto></li>
      </ul>
    </section>

    <form id="barra-projetos" class="barra-ferramentas" role="search" aria-label="Buscar e filtrar projetos">
      <p class="campo-busca"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/bi.svg#buscar"></use></svg>
        <label class="so-leitor-tela" for="busca">Buscar por projeto, código ou cliente</label>
        <input type="search" id="busca" maxlength="100" placeholder="Projeto, COG-2026-100, PLN-2026-0001 ou cliente" autocomplete="off">
      </p>
      <div id="filtro-situacao" class="filtro-pilulas" role="group" aria-label="Situação">
        <button type="button" data-situacao="ativos" aria-pressed="true">Ativos</button>
        <button type="button" data-situacao="atrasados" aria-pressed="false">Atrasados</button>
        <button type="button" data-situacao="semana" aria-pressed="false">Entrega em 7 dias</button>
        <button type="button" data-situacao="aguardando_cliente" aria-pressed="false">Aguardando cliente</button>
        <button type="button" data-situacao="concluido" aria-pressed="false">Concluídos</button>
        <button type="button" data-situacao="todos" aria-pressed="false">Todos</button>
      </div>
    </form>

    <p id="contagem" class="contagem" aria-live="polite"></p>

    <div class="tabela-rolagem">
      <table class="tabela-limpa">
        <caption class="so-leitor-tela">Projetos</caption>
        <thead>
          <tr>
            <th scope="col">Projeto</th>
            <th scope="col">Cliente</th>
            <th scope="col">Etapa</th>
            <th scope="col">Progresso</th>
            <th scope="col">Entrega</th>
            <th scope="col">Pagamento</th>
            <th scope="col"><span class="so-leitor-tela">Ações</span></th>
          </tr>
        </thead>
        <tbody id="tabela-projetos">
          <tr data-esqueleto-tabela><td colspan="7"><span class="so-leitor-tela">Carregando...</span><p data-esqueleto-linha></p><p data-esqueleto-linha></p><p data-esqueleto-linha></p></td></tr>
        </tbody>
      </table>
    </div>
  </main>
  <script src="js/vendor/supabase-2.45.4.min.js"></script>
