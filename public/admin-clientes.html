<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Clientes | CMKCOGIT</title>
  <meta name="theme-color" content="#0F1B33">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/assets/fonts/cogit-font-5.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cogit-font-6.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cogit-font-3.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cogit-font-4.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css?v=b56da26efd">
  <link rel="stylesheet" href="/css/plataforma.css?v=81cda6ec3c">
</head>
<body class="app">
  <a class="pular-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <nav id="menu" aria-label="Menu principal"></nav>
  <header id="barra-topo"></header>
  <main id="conteudo">
    <header class="pagina-cabecalho">
      <div>
        <p class="pagina-rotulo">Painel de gestão</p>
        <h1>Clientes</h1>
        <p>Cada cliente, os projetos dele, quanto pagou e em que pé está cada entrega.</p>
      </div>
    </header>
    <p id="aviso" role="status"></p>
    <p id="erro" role="alert"></p>

    <section class="faixa-kpis" aria-label="Resumo">
      <ul id="resumo-admin" class="kpis" data-livre>
        <li class="kpi" data-esqueleto data-destaque></li><li class="kpi" data-esqueleto></li><li class="kpi" data-esqueleto></li><li class="kpi" data-esqueleto></li><li class="kpi" data-esqueleto></li>
      </ul>
    </section>

    <form id="barra-clientes" class="barra-ferramentas" role="search" aria-label="Buscar e filtrar clientes">
      <p id="campo-busca" class="campo-busca"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/bi.svg#buscar"></use></svg>
        <label class="so-leitor-tela" for="busca">Buscar por projeto, código ou cliente</label>
        <input type="search" id="busca" maxlength="100" placeholder="Projeto, código (COG-2026-100) ou cliente" autocomplete="off">
      </p>
      <div id="filtros-rapidos" class="filtro-pilulas" role="group" aria-label="Filtros rápidos">
        <button type="button" data-filtro="pago" data-grupo="pagamento" aria-pressed="false">Pago</button>
        <button type="button" data-filtro="pendente" data-grupo="pagamento" aria-pressed="false">Pendente</button>
        <button type="button" data-filtro="andamento" data-grupo="andamento" aria-pressed="false">Em andamento</button>
        <button type="button" data-filtro="concluido" data-grupo="andamento" aria-pressed="false">Concluído</button>
        <button type="button" data-filtro="atrasado" data-grupo="prazo" aria-pressed="false">Atrasado</button>
        <button type="button" data-filtro="prazo7" data-grupo="prazo" aria-pressed="false">Entrega em 7 dias</button>
      </div>
      <div id="modo-visao" class="filtro-pilulas" role="group" aria-label="Visualização">
        <button type="button" data-visao="cards" aria-pressed="true"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/bi.svg#visao-cards"></use></svg> Cards</button>
        <button type="button" data-visao="tabela" aria-pressed="false"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/bi.svg#visao-tabela"></use></svg> Tabela</button>
      </div>
    </form>

    <p id="contagem" class="contagem" aria-live="polite"></p>

    <section id="lista-clientes" data-visao="cards" aria-busy="true">
      <article data-esqueleto></article><article data-esqueleto></article><article data-esqueleto></article>
    </section>
  </main>

  <dialog id="detalhe-cliente" class="gaveta" aria-labelledby="detalhe-titulo">
    <header>
      <h2 id="detalhe-titulo">Cliente</h2>
      <button type="button" id="fechar-detalhe" aria-label="Fechar"><svg class="i" aria-hidden="true" focusable="false"><use href="/assets/icons/bi.svg#fechar"></use></svg></button>
    </header>
    <div id="detalhe-conteudo"></div>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="js/app.js?v=6f623e6c28"></script>
  <script src="js/admin-clientes.js?v=404da9b8f3"></script>
</body>
</html>
