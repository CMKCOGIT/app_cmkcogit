<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex">
  <title>Nova senha | CMKCOGIT</title>
  <meta name="theme-color" content="#0F1B33">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="preload" href="/assets/fonts/cogit-font-5.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/cogit-font-6.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/plataforma.css">
  <style>@view-transition { navigation: none; }</style>
</head>
<body class="acesso">
  <main>
    <h1>Criar nova senha</h1>
    <p id="mensagem" role="status">Verificando o link...</p>
    <form id="form-senha" hidden novalidate>
      <p>
        <label for="nova-senha">Nova senha (mínimo 8 caracteres)</label><br>
        <input type="password" id="nova-senha" autocomplete="new-password" required minlength="8">
      </p>
      <p>
        <label for="nova-senha2">Repita a nova senha</label><br>
        <input type="password" id="nova-senha2" autocomplete="new-password" required minlength="8">
      </p>
      <button type="submit">Salvar nova senha</button>
    </form>
    <p><a href="login.html">Voltar para o login</a></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/redefinir-senha.js"></script>
</body>
</html>
